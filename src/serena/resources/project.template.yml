project_name: "project_name"

# Languages for which language servers are started. See:
# https://github.com/oraios/serena/blob/main/src/solidlsp/ls_config.py
languages: ["python"]

encoding: "utf-8"

# unset = use global line_ending from serena_config.yml
line_ending:

ignore_all_files_in_gitignore: true

ls_specific_settings: {}

# Monorepo / cross-package LSP roots (TypeScript supported today)
additional_workspace_folders: []

ignored_paths: []

read_only: false

excluded_tools: []
included_optional_tools: []
fixed_tools: []

# Shown to the agent when this project is activated
initial_prompt: ""

# Override global symbol_info_budget, or omit to use global value
symbol_info_budget:
