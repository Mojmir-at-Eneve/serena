# Line ending convention when writing source files: "lf", "crlf", or "native".
line_ending: native

# Minimum log level (10=debug, 20=info, 30=warning, 40=error)
log_level: 20

# Trace communication between Serena and language servers (debugging)
trace_lsp_communication: False

# Language-server-specific options (see SolidLSP constructors for available keys)
ls_specific_settings: {}

# Paths to ignore in all projects (gitignore syntax; merged with each project's ignored_paths)
ignored_paths: []

# Seconds after which tool executions are terminated
tool_timeout: 240

# Tools to exclude globally
excluded_tools: []

# Optional tools to include (disabled by default)
included_optional_tools: []

# If non-empty, use only these tools (cannot combine with excluded_tools / included_optional_tools)
fixed_tools: []

# Default max characters in tool answers
default_max_tool_answer_chars: 150000

# Seconds per tool call for extra symbol info (docstrings, etc.); 0 disables the budget
symbol_info_budget: 10

# Per-project .serena folder location ($projectDir, $projectFolderName)
project_serena_folder_location: "$projectDir/.serena"

# Registered project paths (updated automatically)
projects: []
